<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg1:#fff1f4;--bg2:#ffd9e4;--ink:#3a1428;--soft:#5e2a48;--heading:#6b1650;
  --paper:#fffaf5;--paper2:#f6ebe3;--accent:#e0446f;--accent2:#ff8fab;--shadow:rgba(74,29,46,.28);
  --btn1:#a3195a;--btn2:#d63a74;
  --letter:#39144D;--letter-ink:#ffffff;--letter-soft:rgba(255,255,255,.78);--letter-hi:#ffc9de;
  --env:#f9dbe2;--env2:#f3c6d1;--env3:#e9b0c0;--wax:#b8233f;--wax2:#7e1028;
  --title:"Pacifico",cursive;--body:"Quicksand",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#2a0f1a;--bg2:#431a2b;--ink:#fff0f5;--soft:#f3c4d5;--heading:#ffc2d8;--paper:#3a1626;--paper2:#311221;
  --accent:#ff6b93;--accent2:#ff9db6;--shadow:rgba(0,0,0,.45);
  --env:#6e2c43;--env2:#5c2438;--env3:#4a1b2d;--wax:#d33a59;--wax2:#8e1532;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#2a0f1a;--bg2:#431a2b;--ink:#fff0f5;--soft:#f3c4d5;--heading:#ffc2d8;--paper:#3a1626;--paper2:#311221;
  --accent:#ff6b93;--accent2:#ff9db6;--shadow:rgba(0,0,0,.45);
  --env:#6e2c43;--env2:#5c2438;--env3:#4a1b2d;--wax:#d33a59;--wax2:#8e1532;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{position:relative;margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);
  font-family:var(--body);font-weight:500;overflow-x:hidden;text-align:center;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-40px;animation:up linear forwards;opacity:.7}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
:root{--main:760px}
@media (min-width:1400px){:root{--main:960px}}
main{position:relative;z-index:1;max-width:var(--main);margin:0 auto;
  padding:40px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
img{-webkit-user-drag:none}
h1,h2,.title{font-family:var(--title);font-weight:400;color:var(--heading)}

/* ---------- DEMO: fotos censuradas (desenfoque) ---------- */
.side-pol img,.photo img,.gpol .thumb img,.lightbox img{filter:blur(7px);clip-path:inset(0)}
.photo .blur,.gpol .thumb .blur{filter:blur(18px) saturate(1.1)}

/* ---------- Fotos en los costados ---------- */
#sides{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.side-pol{position:absolute;width:var(--sw);background:var(--paper);padding:7px 7px 20px;border-radius:4px;
  box-shadow:0 8px 22px var(--shadow);transform:rotate(var(--r));animation:float 7s ease-in-out infinite;animation-delay:var(--dl)}
.side-pol img{display:block;width:100%;height:auto;max-height:calc(var(--sw) * 1.45);object-fit:cover;border-radius:2px}
.side-pol::before{content:"";position:absolute;top:-8px;left:50%;width:46%;height:16px;transform:translateX(-50%) rotate(-4deg);
  background:rgba(255,200,215,.75);border-radius:2px}
@keyframes float{50%{transform:rotate(var(--r)) translateY(-10px)}}
.side-pol{--sw:104px;opacity:.6}
.side-pol.l{left:calc(var(--sw) * -0.42)}
.side-pol.r{right:calc(var(--sw) * -0.42)}
@media (min-width:1100px){
  .side-pol{--sw:clamp(150px,13vw,200px);opacity:1}
  .side-pol.l{left:max(calc(var(--sw) * -0.3),calc(50% - var(--main) / 2 - var(--sw) - var(--j)))}
  .side-pol.r{right:max(calc(var(--sw) * -0.3),calc(50% - var(--main) / 2 - var(--sw) - var(--j)))}
}
@media (min-width:1900px){
  .side-pol{--sw:230px}
}

/* ---------- Portada ---------- */
.hero{min-height:88vh;min-height:88svh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.cake{font-size:clamp(54px,15vw,80px);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.small{letter-spacing:.25em;text-transform:uppercase;font-size:.78rem;font-weight:700;color:var(--soft)}
h1{font-size:clamp(2rem,9.5vw,4.6rem);margin:0;line-height:1.3;overflow-wrap:break-word;max-width:100%}
.sub{color:var(--soft);font-size:clamp(1rem,3.6vw,1.2rem);max-width:30ch;margin:0}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:14px 28px;font-size:1.02rem;color:#fff;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 24px rgba(163,25,90,.35);transition:transform .15s}
.btn:hover{transform:scale(1.05)}
h2{font-size:clamp(1.9rem,7vw,2.4rem);margin:64px 0 4px;line-height:1.4}
.hint{color:var(--soft);font-size:.92rem;margin:0 0 22px}

/* ---------- Libro ---------- */
.stage{perspective:2000px;display:flex;justify-content:center;padding:6px 0 0}
.book{position:relative;transform-style:preserve-3d;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:pan-y;
  font-size:clamp(9px,calc(var(--pw) * .05),19px)}
.book.spread{--pw:min(44vw,340px,calc((100vh - 140px) / 1.36));--pw:min(44vw,340px,calc((100svh - 140px) / 1.36));
  width:calc(var(--pw) * 2);height:calc(var(--pw) * 1.36);transition:transform .9s cubic-bezier(.6,.1,.2,1)}
@media (min-width:1400px){
  .book.spread{--pw:min(44vw,420px,calc((100vh - 160px) / 1.36));--pw:min(44vw,420px,calc((100svh - 160px) / 1.36))}
}
.book.spread.closed{transform:translateX(calc(var(--pw) * -0.5))}
.book.single{--pw:min(86vw,360px,calc((100vh - 190px) / 1.36));--pw:min(86vw,360px,calc((100svh - 190px) / 1.36));
  width:var(--pw);height:calc(var(--pw) * 1.36)}
.book::before,.book::after{content:"";position:absolute;top:0;bottom:0;background:var(--paper2);box-shadow:0 14px 36px var(--shadow);transition:opacity .4s}
.book.spread::before{left:50%;right:0;border-radius:0 14px 14px 0;transform:translate(4px,4px)}
.book.spread::after{left:0;right:50%;border-radius:14px 0 0 14px;transform:translate(-4px,4px)}
.book.spread.closed::after{opacity:0}
.book.single::before{left:0;right:0;border-radius:4px 14px 14px 4px;transform:translate(5px,5px)}
.book.single::after{display:none}
.leaf{position:absolute;top:0;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,.1,.2,1),opacity .2s}
.book.spread .leaf{left:50%;width:50%}
.book.single .leaf{left:0;width:100%}
.leaf.flipped{transform:rotateY(-180deg)}
.book.single .leaf.flipped{opacity:0;pointer-events:none;transition:transform .9s cubic-bezier(.6,.1,.2,1),opacity .25s .65s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 14px 14px 4px;
  overflow:hidden;background:var(--paper);display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--pw) * .055) calc(var(--pw) * .05) calc(var(--pw) * .035)}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent);z-index:3;pointer-events:none}
.face.back{transform:rotateY(180deg);border-radius:14px 4px 4px 14px}
.face.back::before{left:auto;right:0;background:linear-gradient(270deg,rgba(0,0,0,.13),transparent)}
.face.plain{background:var(--paper2)}
.cover-face{background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;justify-content:center;gap:.6em}
.cover-face::after{content:"";position:absolute;inset:.8em;border:2px dashed rgba(255,255,255,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover-face .big{font-size:3.6em;animation:bob 2.4s ease-in-out infinite}
.cover-face .title{color:#fff;font-size:2.1em;line-height:1.35;padding:0 .4em}
.cover-face .tap{font-size:.72em;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.9}
.backcover{background:linear-gradient(145deg,var(--btn2),var(--btn1));color:#fff;justify-content:center;font-size:2.6em}
.photo-wrap{position:relative;width:100%;flex:1;min-height:0}
.photo{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:var(--paper2);box-shadow:0 4px 14px var(--shadow)}
.photo .blur{position:absolute;inset:-24px;background-size:cover;background-position:center;opacity:.9}
.photo img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.photo .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.6em;
  background:linear-gradient(135deg,var(--accent2),var(--accent))}
.tape{position:absolute;top:-.55em;left:50%;width:24%;height:1.25em;transform:translateX(-50%) rotate(-3deg);
  background:rgba(255,200,215,.8);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:2}
.cap{font-family:var(--title);color:var(--heading);font-size:1.3em;line-height:1.35;margin:.6em 0 0;padding:0 .3em}
.note{font-size:.85em;color:var(--soft);margin:.1em 0 0}
.pnum{font-size:.7em;font-weight:700;color:var(--soft);margin-top:.4em}
.end-face{justify-content:center;gap:.8em;padding:1.4em}
.end-face .big{font-size:3em}
.end-face .title{font-size:1.55em;line-height:1.45}
.end-face .btns{display:flex;flex-direction:column;align-items:stretch;gap:.6em;margin-top:.3em;width:min(100%,15em)}
.end-face .btn{padding:.7em 1.2em;font-size:.88em}
.btn.ghost{background:transparent;color:var(--heading);box-shadow:none;border:2px solid var(--heading)}

/* ---------- Galería (pantalla completa) ---------- */
.gallery{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:radial-gradient(circle at 20% 0%,#5a2470,transparent 60%),#39144D;
  opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.gallery.on{opacity:1;visibility:visible;transition:opacity .35s}
.gallery-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) 64px 12px;background:linear-gradient(#39144D 70%,rgba(57,20,77,0))}
.gallery-head h3{margin:0;font-family:var(--title);font-weight:400;color:#fff;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.4}
.gallery-head .count{display:block;font-family:var(--body);font-size:.85rem;font-weight:600;color:rgba(255,255,255,.75)}
.gx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;
  border:0;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;font-size:1.4rem;line-height:1;transition:background .2s}
.gx:hover{background:rgba(255,255,255,.28)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(42vw,190px),1fr));gap:clamp(18px,4vw,34px);
  max-width:1100px;margin:0 auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.gpol{position:relative;border:0;padding:8px 8px 10px;background:#fff;border-radius:3px;cursor:zoom-in;font:inherit;
  box-shadow:0 10px 26px rgba(0,0,0,.4);transform:rotate(var(--r));transition:transform .25s}
.gpol:hover,.gpol:focus-visible{transform:rotate(0) scale(1.05);z-index:1}
.gpol::before{content:"";position:absolute;top:-9px;left:50%;width:44%;height:18px;transform:translateX(-50%) rotate(-4deg);
  background:rgba(255,200,215,.8);border-radius:2px;z-index:1}
.gpol .thumb{position:relative;aspect-ratio:1;overflow:hidden;border-radius:2px;background:#f3e6ee}
.gpol .thumb .blur{position:absolute;inset:-20px;background-size:cover;background-position:center}
.gpol .thumb img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.gpol .thumb .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10vw,52px);
  background:linear-gradient(135deg,var(--accent2),var(--accent))}
.gpol .gcap{display:block;font-family:var(--title);color:#6b1650;font-size:clamp(.85rem,3.4vw,1.05rem);line-height:1.35;margin-top:8px;min-height:1.35em}
.gallery.on .gpol{animation:drop .55s cubic-bezier(.3,.7,.3,1.2) both;animation-delay:var(--d)}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(calc(var(--r) * -2)) scale(.9)}to{opacity:1;transform:rotate(var(--r))}}
body.locked{overflow:hidden}
.blank-face{justify-content:center;color:var(--accent2);font-family:var(--title);font-size:1.4em}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:28px}
@media (max-height:520px) and (orientation:landscape){
  .hero{gap:8px;padding:24px 0}
  .cake{font-size:44px}
  h1{font-size:clamp(1.8rem,10vh,3rem)}
  h2{margin-top:40px}
  .hint{margin-bottom:12px}
  .controls{margin-top:16px}
}
.nav{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--heading);
  background:var(--paper);box-shadow:0 4px 14px var(--shadow);transition:transform .15s,opacity .2s}
.nav:hover{transform:scale(1.08)}
.nav:disabled{opacity:.35;cursor:default;transform:none}
#counter{font-weight:700;color:var(--soft);min-width:64px}

/* ---------- Sobre con sello de cera ---------- */
.env-scene{transition:opacity .6s,transform .6s}
.env-scene.gone{opacity:0;transform:translateY(30px) scale(.9);pointer-events:none}
.env-scene.hidden{display:none}
.envelope{--ew:min(86vw,440px,calc((100vh - 170px) * 1.55));--ew:min(86vw,440px,calc((100svh - 170px) * 1.55));
  position:relative;width:var(--ew);aspect-ratio:1.55;margin:44px auto 0;perspective:1200px;cursor:pointer;
  filter:drop-shadow(0 16px 26px var(--shadow))}
@media (min-width:1400px){.envelope{--ew:min(500px,calc((100vh - 170px) * 1.55));--ew:min(500px,calc((100svh - 170px) * 1.55))}}
.env-scene:not(.open) .envelope{animation:wiggle 3.5s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-2.5deg)}93%{transform:rotate(2.5deg)}96%{transform:rotate(-1deg)}}
.env-back{position:absolute;inset:0;background:var(--env3);border-radius:10px}
.env-letter{position:absolute;left:7%;right:7%;bottom:5%;height:88%;background:var(--letter);border-radius:6px;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12%;gap:8px;
  transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.env-letter .mini{font-family:var(--title);color:#fff;font-size:calc(var(--ew) * .055)}
.env-letter .ln{width:62%;height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.env-letter .ln.s{width:40%}
.env-front{position:absolute;inset:0;z-index:2;border-radius:10px;overflow:hidden}
.env-front::before{content:"";position:absolute;inset:0;background:var(--env);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env-front::after{content:"";position:absolute;inset:0;background:var(--env2);clip-path:polygon(0 100%,50% 50%,100% 100%)}
.env-to{position:absolute;left:0;right:0;bottom:12%;z-index:1;font-family:var(--title);color:var(--heading);font-size:calc(var(--ew) * .055)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;transform-origin:top center;
  transition:transform .75s cubic-bezier(.5,.1,.3,1),z-index 0s .38s}
.flap::before{content:"";position:absolute;inset:0;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.open .flap{transform:rotateX(180deg);z-index:0;transition:transform .75s cubic-bezier(.5,.1,.3,1) .35s,z-index 0s .7s}
.seal{position:absolute;left:50%;top:58%;width:calc(var(--ew) * .17);aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;
  border:0;padding:0;background:none;cursor:pointer}
.seal .half{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.55);font-size:calc(var(--ew) * .07);text-shadow:0 -1px 1px rgba(0,0,0,.35);
  background:radial-gradient(circle at 35% 30%,var(--wax),var(--wax2) 75%);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),inset 0 0 0 7px rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.35);
  transition:transform .6s cubic-bezier(.3,.7,.3,1) .75s,opacity .4s .75s}
.open .seal .half{transition:transform .7s cubic-bezier(.3,.7,.3,1),opacity .7s}
.sealed .seal{animation:press .5s ease}
@keyframes press{40%{transform:translate(-50%,-50%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}
.seal .half.l{clip-path:polygon(0 0,54% 0,44% 30%,56% 55%,46% 100%,0 100%)}
.seal .half.r{clip-path:polygon(54% 0,100% 0,100% 100%,46% 100%,56% 55%,44% 30%)}
.open .seal .half.l{transform:translate(-26px,40px) rotate(-35deg);opacity:0}
.open .seal .half.r{transform:translate(26px,44px) rotate(30deg);opacity:0}
.rise .env-letter{transform:translateY(-58%)}
.env-hint{color:var(--soft);font-size:.9rem;margin-top:22px;transition:opacity .3s}
.open .env-hint{opacity:0}

/* carta abierta */
.full-letter{display:none;position:relative;width:min(100%,560px);overflow-wrap:break-word;margin:46px auto 0;text-align:left;color:var(--letter-ink);
  background-color:var(--letter);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px),radial-gradient(circle at 20% 0%,rgba(255,140,190,.16),transparent 55%);
  background-size:14px 14px,100% 100%;
  border-radius:6px;box-shadow:0 18px 44px rgba(57,20,77,.45);padding:52px clamp(22px,6vw,44px) 36px;line-height:1.85;font-size:1.07rem;
  transform-origin:top center}
.full-letter::before{content:"";display:table}
.full-letter.show{display:block;animation:unfold .9s cubic-bezier(.3,.7,.2,1) both}
.full-letter.closing{animation:fold .65s cubic-bezier(.6,0,.8,.4) both}
@keyframes unfold{from{opacity:0;transform:translateY(-60px) scaleY(.45)}to{opacity:1;transform:none}}
@keyframes fold{from{opacity:1;transform:none}to{opacity:0;transform:translateY(70px) scaleY(.35) scaleX(.8)}}
.full-letter::after{content:"";position:absolute;inset:10px;border:1.5px solid rgba(255,255,255,.18);border-radius:4px;pointer-events:none}
@media (min-width:1400px){.full-letter{width:640px;font-size:1.12rem}}
@media (max-width:440px){
  .full-letter{padding:46px 22px 30px;font-size:1rem}
}
.lightbox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;touch-action:pan-y;
  background:rgba(25,6,35,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;cursor:zoom-out}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;transform:scale(.85);transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.lightbox.on figure{transform:none}
.lightbox img{max-width:92vw;max-height:80vh;max-height:calc(100svh - 120px);min-width:min(60vw,320px);object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#fff}
.lightbox figcaption{font-family:var(--title);color:#fff;font-size:1.3rem;text-align:center;padding:0 52px}
.lightbox figcaption small{display:block;font-family:var(--body);font-size:.8rem;font-weight:600;color:rgba(255,255,255,.7)}
.lightbox .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem;line-height:1;z-index:2}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;z-index:2;
  background:rgba(255,255,255,.18);color:#fff;font-size:1.7rem;line-height:1;transition:background .2s}
.lb-nav:hover{background:rgba(255,255,255,.3)}
.lb-nav.prev{left:max(10px,env(safe-area-inset-left,0px))}
.lb-nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.lightbox:not(.multi) .lb-nav{display:none}
@media (max-width:600px){ .lb-nav{top:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:none} .lightbox.multi figure{margin-bottom:56px}
  .lightbox img{max-height:calc(100vh - 200px);max-height:calc(100svh - 200px)} }
.mini-seal{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:20px;
  background:radial-gradient(circle at 35% 30%,var(--wax),var(--wax2) 75%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.3)}
.full-letter .date{text-align:right;color:var(--letter-soft);font-size:.88rem;margin:0 0 6px}
.full-letter .greet{font-family:var(--title);color:var(--letter-hi);font-size:1.5rem;margin:0 0 14px}
.full-letter p{margin:0 0 16px}
.reveal{opacity:0;transform:translateY(10px)}
.show .reveal{animation:fadeUp .7s ease forwards;animation-delay:var(--d)}
@keyframes fadeUp{to{opacity:1;transform:none}}
.sig{clear:both;text-align:right;margin-top:22px}
.sig span{display:block;color:var(--letter-soft);font-size:.95rem}
.sig b{font-family:var(--title);font-weight:400;color:var(--letter-hi);font-size:1.75rem;line-height:1.5}
.reseal{display:block;margin:24px auto 0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 18px;
  color:#fff;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .2s}
.reseal:hover{background:rgba(255,255,255,.22)}
.foot{color:var(--soft);margin-top:56px;font-size:.98rem}

@media (prefers-reduced-motion: reduce){
  .cake,.cover-face .big,.side-pol,.env-scene .envelope{animation:none!important}
  .leaf,.leaf.flipped,.book.spread{transition:none}
}
</style>
</head>
<body>
<div id="sides" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<main>
  <section class="hero">
    <div class="cake">🎂</div>
    <div class="small">Hoy es tu día</div>
    <h1>¡Feliz cumpleaños, <span id="name"></span>!</h1>
    <p class="sub">Preparé algo pequeño, pero hecho con todo mi cariño.</p>
    <button class="btn" id="go">Ver nuestros recuerdos 📸</button>
  </section>

  <section id="album-sec">
    <h2>Nuestro álbum</h2>
    <p class="hint">Toca una página o desliza para hojearlo 📖</p>
    <div class="stage"><div class="book" id="book" aria-label="Álbum de fotos"></div></div>
    <div class="controls">
      <button class="nav" id="prev" aria-label="Página anterior">‹</button>
      <span id="counter"></span>
      <button class="nav" id="next" aria-label="Página siguiente">›</button>
    </div>
  </section>

  <section id="card-sec">
    <h2>Una carta para ti</h2>
    <div class="env-scene" id="envScene">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir la carta">
        <div class="env-back"></div>
        <div class="env-letter"><div class="mini">Para ti 💌</div><i class="ln"></i><i class="ln"></i><i class="ln s"></i></div>
        <div class="env-front"><div class="env-to" id="envTo"></div></div>
        <div class="flap"></div>
        <div class="seal" aria-hidden="true"><span class="half l" id="sealL"></span><span class="half r" id="sealR"></span></div>
      </div>
      <p class="env-hint">Toca el sello para abrirla 💌</p>
    </div>
    <article class="full-letter" id="full">
      <div class="mini-seal" id="miniSeal"></div>
      <p class="date reveal" id="date" style="--d:.5s"></p>
      <p class="greet reveal" id="greet" style="--d:.7s"></p>
      <div id="msg"></div>
      <div class="sig reveal" id="sig"><span>Con cariño,</span><b id="from"></b></div>
      <button class="reseal" id="reseal">Guardar la carta en su sobre</button>
    </article>
  </section>

  <p class="foot">Con cariño, hoy y siempre 💞</p>
</main>

<div class="gallery" id="gallery" role="dialog" aria-modal="true" aria-label="Nuestro álbum" aria-hidden="true">
  <div class="gallery-head">
    <h3>Nuestro álbum <span class="count" id="gCount"></span></h3>
    <button class="gx" id="gClose" aria-label="Cerrar álbum">✕</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto en grande">
  <button class="x" id="lbClose" aria-label="Cerrar">✕</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Foto anterior">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav next" id="lbNext" aria-label="Foto siguiente">›</button>
</div>

var PAGES = [{t:"cover"}].concat(LIBRO.map(function(f,i){ return {t:"photo", f:f, n:i+1}; }), [{t:"end"}]);

function pageFace(p, back){
  var f = el("div", "face" + (back ? " back" : ""));
  if (p.t === "cover"){
    f.classList.add("cover-face");
    f.appendChild(el("div","big","📖")); f.appendChild(el("div","title","Nuestros recuerdos")); f.appendChild(el("div","tap","Toca para abrir"));
  } else if (p.t === "photo"){
    var wrap = el("div","photo-wrap"), ph = el("div","photo");
    wrap.appendChild(el("span","tape")); wrap.appendChild(ph);
    var showEmoji = function(){ ph.innerHTML = ""; ph.appendChild(el("div","emoji",p.f.e || "💖")); };
    if (p.f.src){
      var bl = el("div","blur"); bl.style.backgroundImage = cssUrl(p.f.src);
      var img = new Image(); img.alt = p.f.cap || ""; img.decoding = "async"; img.src = p.f.src; img.onerror = showEmoji;
      ph.appendChild(bl); ph.appendChild(img);
    } else showEmoji();
    f.appendChild(wrap);
    if (p.f.cap) f.appendChild(el("p","cap",p.f.cap));
    if (p.f.nota) f.appendChild(el("p","note",p.f.nota));
    f.appendChild(el("div","pnum", p.n + " / " + LIBRO.length));
  } else if (p.t === "end"){
    f.classList.add("end-face");
    f.appendChild(el("div","big","💕")); f.appendChild(el("div","title","Y todo lo que nos falta por vivir…"));
    var again = el("button","btn","Volver a empezar");
    again.addEventListener("click", function(e){ e.stopPropagation(); cur = 0; render(); });
    var all = el("button","btn ghost","Nuestro álbum 📸");
    all.addEventListener("click", function(e){ e.stopPropagation(); openGallery(); });
    var btns = el("div","btns"); btns.appendChild(again); btns.appendChild(all);
    f.appendChild(btns);
  } else if (p.t === "blank"){
    f.classList.add("blank-face"); f.textContent = "♡";
  } else if (p.t === "backcover"){
    f.classList.add("backcover"); f.textContent = "💝";
  } else f.classList.add("plain");
  return f;
}
function addLeaf(front, back){
  var l = el("div","leaf"); l.appendChild(pageFace(front,false)); l.appendChild(pageFace(back,true));
  book.appendChild(l); leaves.push(l);
}
function build(){
  single = mq.matches; book.innerHTML = ""; leaves = []; cur = 0;
  book.className = "book " + (single ? "single" : "spread");
  if (single){
    PAGES.forEach(function(p){ addLeaf(p, {t:"plain"}); });
    maxCur = leaves.length - 1;
  } else {
    var pg = PAGES.slice();
    if ((pg.length - 1) % 2) pg.splice(pg.length - 1, 0, {t:"blank"});
    if (pg.length % 2) pg.push({t:"backcover"});
    for (var i = 0; i < pg.length; i += 2) addLeaf(pg[i], pg[i+1]);
    maxCur = (pg.length - 2) / 2;
  }
  render();
}
function render(){
  var N = leaves.length;
  leaves.forEach(function(l,i){
    l.classList.toggle("flipped", i < cur);
    if (!l._moving) l.style.zIndex = i < cur ? i + 1 : 2 * N - i;
  });
  book.classList.toggle("closed", !single && cur === 0);
  prev.disabled = cur === 0; next.disabled = cur === maxCur;
  counter.textContent = (cur + 1) + " / " + (maxCur + 1);
}
function go(d){
  var n = Math.max(0, Math.min(maxCur, cur + d)); if (n === cur) return;
  var l = leaves[d > 0 ? cur : cur - 1];
  l._moving = true; l.style.zIndex = 3 * leaves.length;
  setTimeout(function(){ l._moving = false; render(); }, 950);
  cur = n; render();
}
prev.addEventListener("click", function(){ go(-1); });
next.addEventListener("click", function(){ go(1); });
book.addEventListener("click", function(e){
  var r = book.getBoundingClientRect();
  go(e.clientX - r.left > r.width * (single ? .35 : .5) ? 1 : -1);
});
var sx = null;
book.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive:true});
book.addEventListener("touchend", function(e){
  if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40){ e.preventDefault(); go(dx < 0 ? 1 : -1); }
});
document.addEventListener("keydown", function(e){ if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });

var gal = document.getElementById("gallery"), grid = document.getElementById("grid"), galBuilt = false, lastFocus = null;

  GALERIA.forEach(function(f, i){

    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") stepLb(1);
    if (e.key === "ArrowLeft") stepLb(-1);
    e.stopImmediatePropagation(); return;
  }
  if (gal.classList.contains("on")){ if (e.key === "Escape") closeGallery(); e.stopImmediatePropagation(); }
}, true);
var opening = false, busy = false, timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, reduce ? 0 : ms)); }
function openLetter(){
  if (opening || busy) return; opening = true;
  var t = reduce ? [0,0,0] : [0, 1150, 2300];
  scene.classList.add("open");
  timers.push(setTimeout(function(){ scene.classList.add("rise"); }, t[1]));
  timers.push(setTimeout(function(){
    scene.classList.add("gone");
    setTimeout(function(){
      scene.classList.add("hidden"); full.classList.add("show");
      full.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
      if (!reduce) for (var i = 0; i < 36; i++) setTimeout(heart, i*65);
    }, reduce ? 0 : 550);
  }, t[2]));
}
envelope.addEventListener("click", openLetter);
envelope.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openLetter(); } });
document.getElementById("reseal").addEventListener("click", function(){
  if (busy) return; busy = true;
  timers.forEach(clearTimeout); timers = [];
  closeLightbox();
  full.classList.add("closing");
  later(function(){
    full.classList.remove("show", "closing");
    scene.className = "env-scene open rise gone";
    void scene.offsetWidth;
    scene.classList.remove("gone");
    document.getElementById("card-sec").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
    later(function(){ scene.classList.remove("rise"); }, 700);
    later(function(){ scene.classList.remove("open"); }, 1650);
    later(function(){ scene.classList.add("sealed"); }, 2950);
    later(function(){ scene.classList.remove("sealed"); opening = false; busy = false; }, 3500);
  }, 650);
});
</script>
</body>
